[package]
name = "nearby-cast"
version = "0.1.0"
description = "Cast anything. Nearby. Modern Linux desktop screen casting application."
authors = ["Nearby Cast Contributors"]
edition = "2021"

# Lib target for Tauri to use (rlib for binary linking, cdylib for mobile)
[lib]
name = "nearby_cast_lib"
crate-type = ["rlib"]

[[bin]]
name = "nearby-cast"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
mdns-sd = "0.11"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
ring = "0.17"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }
tokio-stream = "0.1.19"
local-ip-address = "0.6.13"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
