name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev
      - name: Build
        run: |
          npm ci
          npm run build
          npm run tauri build -- --bundles deb
      - name: Archive binary
        run: |
          tar -czf nearby-cast-linux-x86_64.tar.gz -C src-tauri/target/release nearby-cast ../../../cast_launcher.py
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: nearby-cast-linux-x86_64
          path: nearby-cast-linux-x86_64.tar.gz

  publish-release:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: nearby-cast-linux-x86_64
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: nearby-cast-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-aur:
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
