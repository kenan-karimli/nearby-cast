name: nearby-cast
version: '0.1.0'
summary: Cast anything. Nearby.
description: |
  Modern Linux desktop screen casting application. Discover compatible devices
  on your local network and instantly cast your screen — wirelessly, to Android TV,
  Chromecast, DLNA devices, or any browser on your network.
  Supports full screen, window, and region capture on Wayland/X11.
grade: stable
confinement: strict
base: core22

apps:
  nearby-cast:
    command: bin/nearby-cast
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - wayland
      - x11
      - opengl
      - home
      - removable-media
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET:$SNAP/usr/lib

parts:
  nearby-cast:
    plugin: rust
    source: .
    source-type: git
    build-packages:
      - nodejs
      - npm
      - libwebkit2gtk-4.1-dev
      - libgtk-3-dev
      - libappindicator3-dev
      - librsvg2-dev
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
      - libayatana-appindicator3-1
      - librsvg2-2
      - wf-recorder
      - ffmpeg
      - python3
      - python3-requests
    override-build: |
      npm ci
      npm run build
      cargo build --release --manifest-path src-tauri/Cargo.toml
      install -Dm755 src-tauri/target/release/nearby-cast $SNAPCRAFT_PART_INSTALL/bin/nearby-cast
      install -Dm644 cast_launcher.py $SNAPCRAFT_PART_INSTALL/share/nearby-cast/cast_launcher.py
